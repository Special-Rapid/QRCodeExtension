<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR Scan</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="app-header">
        <svg aria-hidden="true" class="brand-icon" viewBox="0 0 32 32"><path d="M3 3h10v10H3zM19 3h10v10H19zM3 19h10v10H3zM21 19h3v3h-3zm5 0h3v5h-3zm-5 5h5v5h-5z"/></svg>
        <h1>QR Scan</h1>
      </header>

      <section class="content" aria-labelledby="scan-heading">
        <h2 id="scan-heading">QRコード・URL文字列を読み取る</h2>
        <p class="intro">画面に表示中のQRコードとURL文字列、または画像ファイル内のQRコードをこの端末内だけで解析します。</p>

        <button id="scan-page" class="button primary" type="button" disabled aria-busy="true">
          <span class="button-content" hidden>
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h-3"/><path d="M8 8h8v8H8z"/></svg>
            <span>もう一度スキャン</span>
          </span>
          <span id="scan-loading" class="spinner" aria-hidden="true"></span>
          <span class="sr-only">ページをスキャンしています</span>
        </button>

        <label class="button secondary" for="image-file">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m5 18 5-5 3 3 2-2 4 4"/></svg>
          画像を選択
          <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
        </label>

        <p id="status" class="status" role="status" aria-live="polite">ページを開いたまま「このページをスキャン」を押してください。</p>

        <section id="results" class="results" aria-labelledby="results-heading" hidden>
          <div class="results-heading">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>
            <h2 id="results-heading">読み取り結果</h2>
          </div>
          <ol id="result-list" class="result-list"></ol>
        </section>
      </section>

      <footer>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 4 6v5c0 5.1 3.4 8.8 8 10 4.6-1.2 8-4.9 8-10V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>カメラ不使用・すべてローカル処理</span>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
