name: Verify

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'tooling/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'tooling/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Root checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/extension/package-lock.json
            apps/handoff/package-lock.json
            apps/mobile/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix apps/extension ci
          npm --prefix apps/handoff ci
          npm --prefix apps/mobile ci

      - name: Run all repository checks
        run: npm run check
